<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/style.css">

        <!-- Generic fallback metadata: JS/animaldetail.js replaces the title, description and keywords with the selected animal's own. -->
        <title>Animal Details | Paws and Claws Animal Rescue</title>
        <meta name="description" content="See photos, temperament, age and adoption details for an animal available at Paws and Claws Animal Rescue in Gauteng.">
        <meta name="keywords" content="pet adoption, adopt a dog, adopt a cat, animal rescue, Gauteng, South Africa">
    </head>
    <body>
        <!-- Site header: branding and a back-to-listing link (no full nav on this page). -->
        <header class="header">
            <div class="nav-container">
                <h1 class="title intro">Paws and Claws Animal Rescue</h1>
                <nav class="nav">
                    <ul>
                        <li><a href="animals.html">< Back to adopt</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <div class="content-detail">

            <!-- Everything below is filled in by JS/animaldetail.js from the animal whose id is in the query string (animaldetail.html?id=2). It stays hidden until then so empty placeholders never show. -->
            <div id="animal-detail" hidden>

                <!-- Image gallery: main photo plus thumbnails (one button per photo, built by JS). -->
                <div class="animal-detail-card">
                    <div class="animal-detail-image-container">
                        <img class="main-detail-image" id="animal-main-image" src="" alt="">
                    </div>

                    <div class="animal-detail-images" id="animal-thumbnails"></div>
                </div>

                <!-- Core animal details: name, breed/gender/age tags, price, and condition. -->
                <div class="animal-detail-info">
                    <h2 class="animal-detail-name" id="animal-name"></h2>
                    <div class="descriptor-bubble">
                        <p class="animal-detail-breed" id="animal-species"></p>
                    </div>
                    <div class="descriptor-bubble">
                        <p class="animal-detail-gender" id="animal-gender"></p>
                    </div>

                    <div class="descriptor-bubble">
                        <p class="animal-detail-age" id="animal-age"></p>
                    </div>

                    <div class="animal-info">
                        <p class="animal-price">Price: </p>
                        <p class="animal-price-flag" id="animal-price"></p>
                        <span class="detail-separator"></span>
                        <p class="animal-condition" id="animal-condition"></p>
                    </div>

                </div>

                <!-- Temperament tags for the animal (built by JS). -->
                <div class="animal-temperment-section">
                    <div class="temperament-title">
                        <h3 class="temperament-title">Temperament</h3>
                    </div>

                    <div class="temperament-bubbles" id="animal-temperament"></div>
                </div>

                <!-- Numbered walkthrough of the adoption process. -->
                <div class="animal-adoption-steps">
                    <div class="application-step">
                        <p class="step-number">1</p>
                        <p class="step-action">Apply.</p>
                    </div>

                    <div class="application-step">
                        <p class="step-number">2</p>
                        <p class="step-action">Meet.</p>
                    </div>

                    <div class="application-step">
                        <p class="step-number">3</p>
                        <p class="step-action">Bring Home!</p>
                    </div>
                </div>

                <!-- Adoption CTA. Not yet wired up to any adoption flow. -->
                <div class="adopt-button-container">
                    <button class="adopt-button">Start Adoption -->></button>
                </div>
            </div>

            <!-- Shown by JS instead of the above when the id is missing or matches no animal. -->
            <p class="animal-not-found" id="animal-not-found" role="alert" hidden>
                Sorry, we couldn't find that animal. <a href="animals.html">See all animals available for adoption</a>.
            </p>

            <noscript>
                <p class="animal-not-found">This page needs JavaScript to show an animal's details. <a href="animals.html">Back to adopt</a>.</p>
            </noscript>
        </div>

        <script src="JS/animals-data.js"></script>
        <script src="JS/animaldetail.js"></script>
    </body>
</html>
