<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <title>Paws and Claws Animal Rescue</title>
    </head>
    <body>
        <!-- Site header: branding and a back-to-listing link (no full nav on this page). -->
        <header class="header">
            <div class="nav-container">
                <h1 class="title intro">Paws and Claws Animal Rescue</h1>
                <nav class="nav">
                    <ul>
                        <li><a href="animals.html">< Back to adopt</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <div class="content-detail">

            <!-- DISCLAIMER: All this info is hard coded for now, but will ideally be dynamically populated by the backend based on the selected animal, will ammend and add IDs to the elements if needed. -->

            <!-- Image gallery: main photo plus thumbnails. -->
            <div class="animal-detail-card">
                <div class="animal-detail-image-container">
                    <img class="main-detail-image" src="{Update}" alt="Animal Image">
                </div>

                <div class="animal-detail-images">
                    <!-- Images for the rest of the images not in focus, add on click listener to bring into main focus -->
                    <img class="curtain-image" src="{Update}" alt="Animal Image 1">
                    <img class="curtain-image" src="{Update}" alt="Animal Image 2">
                    <img class="curtain-image" src="{Update}" alt="Animal Image 3">
                </div>
            </div>

            <!-- Core animal details: name, breed/gender/age tags, price, and condition. -->
            <div class="animal-detail-info">
                <h2 class="animal-detail-name">Milo</h2>
                <div class="descriptor-bubble">
                    <p class="animal-detail-breed">Dog</p>
                </div>
                <div class="descriptor-bubble">
                    <p class="animal-detail-gender">Male</p>
                </div>

                <div class="descriptor-bubble">
                    <p class="animal-detail-age">2 years</p>
                </div>

                <div class="animal-info">
                    <p class="animal-price">Price: </p>
                    <p class="animal-price-flag">R1 500.00</p>
                    <span class="detail-separator"></span>
                    <p class="animal-condition">Vaccinated & Neutered.</p>
                </div>

            </div>

            <!-- Temperament tags for the animal. -->
            <div class="animal-temperment-section">
                <div class="temperament-title">
                    <h3 class="temperament-title">Temperament</h3>
                </div>

                <div class="temperament-bubbles">
                    <div class="descriptor-bubble">Playful</div>
                    <div class="descriptor-bubble">Loving</div>
                    <div class="descriptor-bubble">Good w/ Kids</div>
                </div>
            </div>

            <!-- Numbered walkthrough of the adoption process. -->
            <div class="animal-adoption-steps">
                <div class="application-step">
                    <p class="step-number">1</p>
                    <p class="step-action">Apply.</p>
                </div>

                <div class="application-step">
                    <p class="step-number">2</p>
                    <p class="step-action">Meet.</p>
                </div>

                <div class="application-step">
                    <p class="step-number">3</p>
                    <p class="step-action">Bring Home!</p>
                </div>
            </div>

            <!-- Adoption CTA. Not yet wired up to any adoption flow. -->
            <div class="adopt-button-container">
                <button class="adopt-button">Start Adoption -->></button>
            </div>
        </div>
    </body>
</html>
